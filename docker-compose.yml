services:
  api:
    build: .
    container_name: traderaig-api
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=traderaig
      - POSTGRES_PASSWORD=change-me
      - POSTGRES_DB=traderaig
      - REDIS_HOST=redis
      - API_PORT=8000
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./bridge:/app/bridge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - traderaig

  postgres:
    image: postgres:15-alpine
    container_name: traderaig-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=traderaig
      - POSTGRES_PASSWORD=change-me
      - POSTGRES_DB=traderaig
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traderaig"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - traderaig

  redis:
    image: redis:7-alpine
    container_name: traderaig-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - traderaig

volumes:
  pgdata:

networks:
  traderaig:
    driver: bridge